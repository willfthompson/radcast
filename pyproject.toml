[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radcast"
version = "0.1.0"
description = "Record a live audio stream on a timer and serve the recordings as a podcast."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22",
    "apscheduler>=3.10,<4",
    "feedgen>=1.0",
    "pyyaml>=6",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
radcast = "radcast.__main__:main"

[tool.setuptools]
packages = ["radcast"]

[tool.setuptools.package-data]
radcast = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
